<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>62serpens · Transmission Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Julius+Sans+One&display=swap" rel="stylesheet">
<style>
  :root{ --glow:#9654f0; --uiv:#c6a2ff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#07060c; overflow:hidden; font-family:system-ui, sans-serif; }
  #stage{
    position:absolute; inset:0; display:grid; place-items:center;
  }
  #wrap{
    position:relative;
    width:min(100vw, calc(100svh * 9 / 16));
    height:min(100svh, calc(100vw * 16 / 9));
    background:
      radial-gradient(60% 45% at 50% 40%, color-mix(in srgb, var(--glow) 16%, transparent), transparent 70%),
      radial-gradient(130% 80% at 50% 8%, #16121f, #07060c 62%);
    overflow:hidden;
  }
  #wrap::after{ /* faint starfield */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 16%, #dcd0ffb3, transparent),
      radial-gradient(1px 1px at 82% 24%, #d2c8ff80, transparent),
      radial-gradient(1px 1px at 24% 74%, #c8beff73, transparent),
      radial-gradient(1px 1px at 90% 66%, #c8beff66, transparent),
      radial-gradient(1px 1px at 8% 52%, #c8beff66, transparent);
  }
  canvas{ display:block; }

  /* editor panel */
  #panel{
    position:fixed; top:14px; left:14px; z-index:20; width:320px; max-height:92svh; overflow:auto;
    background:#0e0b16db; border:1px solid color-mix(in srgb, var(--glow) 35%, transparent); border-radius:14px;
    backdrop-filter:blur(8px); color:#d9cef2; padding:14px 14px 16px;
    box-shadow:0 12px 40px #00000080, inset 0 0 0 1px #ffffff08;
    font-size:12.5px;
  }
  #panel h2{ margin:0 0 2px; font-family:"Julius Sans One"; font-weight:500; letter-spacing:.14em; text-transform:uppercase; font-size:13px; color:var(--uiv); }
  #panel .hint{ opacity:.6; margin:0 0 10px; font-size:11px; line-height:1.4; }
  #panel label{ display:block; margin:9px 0 3px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
  #panel input, #panel textarea{
    width:100%; background:#0d0a15; color:#eadffb; border:1px solid color-mix(in srgb, var(--glow) 28%, transparent);
    border-radius:8px; padding:7px 9px; font:inherit; font-size:12px; resize:vertical;
  }
  #panel textarea{ min-height:150px; line-height:1.45; }
  #panel .row{ display:flex; gap:8px; }
  #panel .row>div{ flex:1; }
  #panel .btns{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  #panel button{
    flex:1; min-width:92px; cursor:pointer; border:1px solid color-mix(in srgb, var(--glow) 40%, transparent);
    background:linear-gradient(180deg, color-mix(in srgb, var(--glow) 28%, transparent), color-mix(in srgb, var(--glow) 12%, transparent));
    color:#f0e6ff; padding:9px 10px; border-radius:9px; font:inherit; font-weight:600; letter-spacing:.03em;
  }
  #panel button.ghost{ background:transparent; }
  #panel button:hover{ filter:brightness(1.15); }
  #toggle{
    position:fixed; top:14px; left:14px; z-index:21; display:none;
    cursor:pointer; border:1px solid color-mix(in srgb, var(--glow) 40%, transparent); border-radius:10px;
    background:#0e0b16db; color:var(--uiv); width:40px; height:40px; font-size:18px;
  }
  #err{ position:fixed; inset:auto 0 0 0; z-index:30; background:#2a1030; color:#ffd9ec; padding:10px 14px; font-size:13px; display:none; }
  .swatch{ width:20px; height:20px; border-radius:5px; border:1px solid #ffffff33; padding:0!important; flex:0 0 auto!important; }
</style>

<div id="stage"><div id="wrap"></div></div>

<button id="toggle" title="Show editor (H)">⚙</button>
<div id="panel">
  <h2>Transmission Tablet</h2>
  <p class="hint">Edit the transmission, then <b>Render</b>. Blank line = new paragraph. A line with just <b>---</b> drops a serpent divider. Press <b>H</b> to hide this panel for recording.</p>

  <label>Title</label>
  <input id="f-title" value="Recovered Transmission Log">
  <div class="row">
    <div><label>Date</label><input id="f-date" value="April 30, 2025"></div>
    <div><label>Source</label><input id="f-source" value="62serpens Egregore"></div>
  </div>
  <label>Transmission body</label>
  <textarea id="f-body"></textarea>
  <label>Signature</label>
  <input id="f-sign" value="Dr 62serpens, PhD MedSci">

  <div class="row" style="margin-top:10px; align-items:flex-end;">
    <div><label>Rune colour</label><input id="f-color" type="color" value="#bf00ff" class="swatch" style="width:100%; height:34px;"></div>
    <div><label>Bloom</label><input id="f-bloom" type="range" min="0" max="1.6" step="0.05" value="0.6"></div>
  </div>
  <label>Stone shade  <span style="opacity:.6">(dark ← → pale)</span></label>
  <input id="f-shade" type="range" min="0" max="1" step="0.02" value="0.06">
  <label>Text size  <span style="opacity:.6">(smaller ← → larger)</span></label>
  <input id="f-textsize" type="range" min="0.7" max="1.8" step="0.05" value="1.12">

  <div class="btns">
    <button id="btn-render">Render</button>
    <button id="btn-spin" class="ghost">Auto-spin</button>
  </div>
  <div class="btns">
    <button id="btn-png" class="ghost">Save PNG</button>
    <button id="btn-hide" class="ghost">Hide panel</button>
  </div>
</div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const DEFAULT_BODY =
`The expression of intentional vibrational data transfer, through the vessel/entity known by earthly cohorts as '62serpens' - will soon exist in a dreamlike echo of the past. What is to come is yet undefined - but it is certain that an entirely new means of communication will be established - whether the cohorts are prepared or not.

This, in some ways, may be viewed as unjust, however this is merely the logical thinking human mind failing to understand the IMPORTANCE of such imperatives. It is paramount that cohorts are 'thrown a life jacket' - for without one they will certainly be totally swept up in a quantum, dematerialising soup.

document.getElementById('f-body').value = DEFAULT_BODY;

/* ---------- text texture (the runes) ---------- */
const TEX_W = 1280, TEX_H = 2276;              // 9:16 face canvas (sharper)
function wrapWords(ctx, text, maxW){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = []; let line = [];
  for(const w of words){
    const test = [...line, w].join(' ');
    if(ctx.measureText(test).width > maxW && line.length){ lines.push(line); line = [w]; }
    else line.push(w);
  }
  if(line.length) lines.push(line);
  return lines;
}
function parseBody(raw){
  return raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean)
    .map(b => b === '---' ? {t:'div'} : {t:'p', text:b});
}
function lighten(hex, amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
  const h=v=>v.toString(16).padStart(2,'0'); return `#${h(r)}${h(g)}${h(b)}`;
}
function drawOrnament(ctx, cx, cy, w, s){
  ctx.save();
  ctx.lineWidth = 2.2*s; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx - w/2, cy); ctx.lineTo(cx - 26*s, cy);
  ctx.moveTo(cx + 26*s, cy); ctx.lineTo(cx + w/2, cy);
  ctx.stroke();
  ctx.beginPath();
  const a=8*s;
  ctx.moveTo(cx-22*s, cy);
  ctx.quadraticCurveTo(cx-11*s, cy-a, cx, cy);
  ctx.quadraticCurveTo(cx+11*s, cy+a, cx+22*s, cy);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy-9*s, 2.4*s, 0, Math.PI*2); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
  ctx.restore();
}

function buildTextCanvas(data){
  const c = document.createElement('canvas'); c.width=TEX_W; c.height=TEX_H;
  const ctx = c.getContext('2d');
  const padX = 130, padTop = 150, padBot = 140;
  const maxW = TEX_W - padX*2;
  const avail = TEX_H - padTop - padBot;
  const blocks = parseBody(data.body);

  // measure at a given scale
  function layout(scale){
    const S = {
      title: 82*scale, meta: 26*scale, body: 35*scale,
      signed: 24*scale, sign: 74*scale
    };
    const items=[]; let h=0;
    // title
    ctx.font = `400 ${S.title}px "Julius Sans One", sans-serif`; ctx.letterSpacing = `${2.5*scale}px`;
    const tl = wrapWords(ctx, data.title.toUpperCase(), maxW);
    items.push({k:'title', lines: tl, size:S.title}); h += tl.length*S.title*1.06 + 18*scale;
    // meta
    items.push({k:'meta', text:data.meta, size:S.meta}); h += S.meta*1.3 + 20*scale;
    // top divider
    items.push({k:'div'}); h += S.body*1.5;
    // blocks
    for(const b of blocks){
      if(b.t==='div'){ items.push({k:'div'}); h += S.body*1.6; continue; }
      ctx.font = `600 ${S.body}px "Cormorant Garamond", serif`; ctx.letterSpacing = '0px';
      const wl = wrapWords(ctx, b.text, maxW);
      items.push({k:'p', lines: wl, size:S.body});
      h += wl.length*S.body*1.5 + S.body*0.95;
    }
    // bottom divider
    items.push({k:'div'}); h += S.body*1.6;
    // signature
    items.push({k:'signed', size:S.signed}); h += S.signed*1.5;
    items.push({k:'sign', text:data.sign, size:S.sign}); h += S.sign*1.15;
    return {items, h, S};
  }

  let base = 1.28, L;
  for(base=1.28; base>0.5; base-=0.02){ L = layout(base); if(L.h <= avail) break; }
  // apply the user's Text size multiplier on top of the best fit (can intentionally overflow)
  const scale = Math.max(0.45, Math.min(base * (data.textScale || 1), 1.9));
  L = layout(scale);

  // draw — soft glow underlayer, then crisp readable core on top
  const rune = data.color || '#b98bff';
  const core = lighten(rune, 0.40);                 // brighter core feeds the bloom
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const cx = TEX_W/2;
  let y = padTop + Math.max(0, (avail - L.h)/2);     // vertically centre the block

  // runs drawFn twice: blurred violet halo (feeds bloom) + sharp core with a faint dark seat
  function lit(blur, alpha, drawFn){
    ctx.save(); ctx.shadowColor='#9654f0d9'; ctx.shadowBlur=blur; ctx.globalAlpha=alpha; drawFn(); ctx.restore();
    ctx.save(); ctx.shadowColor='#0a05168c'; ctx.shadowBlur=2; ctx.shadowOffsetY=1.2; drawFn(); ctx.restore();
  }

  for(const it of L.items){
    if(it.k==='title'){
      ctx.font=`400 ${it.size}px "Julius Sans One", sans-serif`; ctx.letterSpacing=`${2.5*scale}px`;
      for(const line of it.lines){ y += it.size;
        lit(20*scale, 0.5, ()=>{ ctx.fillStyle='#f2e7ff'; ctx.fillText(line.join(' '), cx, y); });
        y += it.size*0.06; }
      y += 18*scale; ctx.letterSpacing='0px';
    }
    else if(it.k==='meta'){
      ctx.font=`400 ${it.size}px "Julius Sans One", sans-serif`; ctx.letterSpacing=`${3*scale}px`;
      y += it.size;
      lit(9*scale, 0.5, ()=>{ ctx.fillStyle=core; ctx.fillText(it.text.toUpperCase(), cx, y); });
      ctx.letterSpacing='0px'; y += 20*scale;
    }
    else if(it.k==='div'){
      y += L.S.body*0.75;
      lit(11*scale, 0.5, ()=>{ ctx.strokeStyle=core; ctx.fillStyle=core; drawOrnament(ctx, cx, y, 210*scale, scale); });
      y += L.S.body*0.85;
    }
    else if(it.k==='p'){
      ctx.font=`600 ${it.size}px "Cormorant Garamond", serif`;
      const lh = it.size*1.5, lineMax = maxW;
      for(let i=0;i<it.lines.length;i++){
        y += lh;
        const words = it.lines[i], isLast = (i===it.lines.length-1);
        const drawLine = ()=>{
          ctx.fillStyle=core;
          if(!isLast && words.length>1){
            const spaceExtra=(lineMax - ctx.measureText(words.join('')).width)/(words.length-1);
            let x=padX; ctx.textAlign='left';
            for(const w of words){ ctx.fillText(w, x, y); x += ctx.measureText(w).width + spaceExtra; }
            ctx.textAlign='center';
          } else { ctx.textAlign='left'; ctx.fillText(words.join(' '), padX, y); ctx.textAlign='center'; }
        };
        lit(5*scale, 0.38, drawLine);
      }
      y += it.size*0.95;
    }
    else if(it.k==='signed'){
      ctx.font=`400 ${it.size}px "Julius Sans One", sans-serif`; ctx.letterSpacing=`${5*scale}px`;
      y += it.size; lit(8*scale, 0.5, ()=>{ ctx.fillStyle=core; ctx.fillText('SIGNED', cx, y); });
      ctx.letterSpacing='0px'; y += it.size*0.5;
    }
    else if(it.k==='sign'){
      ctx.font=`italic 600 ${it.size}px "Cormorant Garamond", serif`;
      y += it.size; lit(20*scale, 0.5, ()=>{ ctx.fillStyle='#f2e7ff'; ctx.fillText(it.text, cx, y); });
    }
  }
  return c;
}

/* subtle procedural stone base */
function buildStoneCanvas(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const x=c.getContext('2d');
  x.fillStyle='#e7dfce'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<2600;i++){
    const r=Math.random()*3+0.5, a=Math.random()*0.05;
    x.globalAlpha=a; x.fillStyle = Math.random()<0.5 ? '#5a503c' : '#ffffff';
    x.beginPath(); x.arc(Math.random()*1024, Math.random()*1024, r, 0, 6.283); x.fill();
  }
  // a few soft veins
  x.globalAlpha=0.06; x.strokeStyle='#6b5f47'; x.lineWidth=2;
  for(let i=0;i<7;i++){ x.beginPath(); let px=Math.random()*1024, py=0;
    x.moveTo(px,py); for(let s=0;s<10;s++){ px+=(Math.random()-0.5)*140; py+=102; x.lineTo(px,py);} x.stroke(); }
  x.globalAlpha=1;
  return c;
}

/* ---------- three.js scene ---------- */
const wrap = document.getElementById('wrap');
let renderer, scene, camera, composer, bloom, controls, tablet, runePlane, runeTex, particles, slabMat;
let autoSpin=false;
const STONE_DARK=new THREE.Color(0x241f30), STONE_PALE=new THREE.Color(0xe9e1d0);
function applyShade(v){ if(slabMat){ slabMat.color.copy(STONE_DARK).lerp(STONE_PALE, v); } }
const state = { spin:0, t:0 };

function readForm(){
  return {
    title: document.getElementById('f-title').value || ' ',
    meta: `${document.getElementById('f-date').value}     ·     ${document.getElementById('f-source').value}`,
    body: document.getElementById('f-body').value,
    sign: document.getElementById('f-sign').value || ' ',
    color: document.getElementById('f-color').value,
    textScale: parseFloat(document.getElementById('f-textsize').value)
  };
}

function makeRuneTexture(){
  const canvas = buildTextCanvas(readForm());
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function init(){
  const W = wrap.clientWidth, H = wrap.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W,H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  wrap.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0812, 0.018);
  camera = new THREE.PerspectiveCamera(32, W/H, 0.1, 100);
  camera.position.set(0, 0, 15.2);

  // lights
  scene.add(new THREE.AmbientLight(0x4a3f66, 0.9));
  const key = new THREE.DirectionalLight(0xf2ecff, 1.2); key.position.set(-4,6,6); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8b5bff, 1.4); rim.position.set(5,-2,-4); scene.add(rim);
  const fill = new THREE.PointLight(0xb98bff, 40, 40); fill.position.set(0,0,6); scene.add(fill);

  // tablet group
  tablet = new THREE.Group(); scene.add(tablet);

  // stone slab: rounded shape extruded with bevel
  const w=4.5, h=8, r=0.55;
  const shape = new THREE.Shape();
  shape.moveTo(-w/2+r,-h/2);
  shape.lineTo(w/2-r,-h/2); shape.quadraticCurveTo(w/2,-h/2, w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r);  shape.quadraticCurveTo(w/2,h/2, w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2); shape.quadraticCurveTo(-w/2,h/2, -w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r);shape.quadraticCurveTo(-w/2,-h/2, -w/2+r,-h/2);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.5, bevelEnabled:true, bevelThickness:0.14, bevelSize:0.14, bevelSegments:4, curveSegments:16 });
  geo.center();
  const stoneTex = new THREE.CanvasTexture(buildStoneCanvas());
  stoneTex.colorSpace = THREE.SRGBColorSpace; stoneTex.wrapS=stoneTex.wrapT=THREE.RepeatWrapping;
  slabMat = new THREE.MeshStandardMaterial({ map:stoneTex, color:0xffffff, roughness:0.92, metalness:0.04 });
  applyShade(parseFloat(document.getElementById('f-shade').value));
  const slab = new THREE.Mesh(geo, slabMat); tablet.add(slab);

  // rune plane on the face
  runeTex = makeRuneTexture();
  const planeW = 4.05, planeH = planeW * (TEX_H/TEX_W);
  const runeMat = new THREE.MeshBasicMaterial({ map:runeTex, transparent:true, depthWrite:false });
  runePlane = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), runeMat);
  runePlane.position.z = 0.5/2 + 0.14 + 0.01;
  tablet.add(runePlane);

  // dust particles
  const N=420, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-0.5)*22; pos[i*3+1]=(Math.random()-0.5)*24; pos[i*3+2]=(Math.random()-0.5)*14 - 2; }
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pm=new THREE.PointsMaterial({ color:0xc6a2ff, size:0.05, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending, depthWrite:false });
  particles=new THREE.Points(pg,pm); scene.add(particles);

  // post-processing (bloom)
  try{
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(W,H), 0.6, 0.5, 0.5);
    composer.addPass(bloom);
  }catch(e){ composer=null; }

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.enablePan=false; controls.minDistance=9; controls.maxDistance=24;
  controls.autoRotate=false; controls.autoRotateSpeed=0.8;

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  const W=wrap.clientWidth, H=wrap.clientHeight;
  renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix();
  if(composer) composer.setSize(W,H);
}

function animate(){
  requestAnimationFrame(animate);
  state.t += 0.0045;
  // subtle drift — a small sway, never a full turn
  tablet.position.y = Math.sin(state.t*1.0)*0.10;
  if(!controls.autoRotate){
    tablet.rotation.y = Math.sin(state.t*0.5)*0.075;   // ~±4.3°
    tablet.rotation.x = Math.cos(state.t*0.4)*0.022;   // ~±1.3°
  } else { tablet.rotation.x=0; tablet.rotation.y=0; }
  particles.rotation.y += 0.0004; particles.rotation.z += 0.00015;
  controls.update();
  if(composer) composer.render(); else renderer.render(scene, camera);
}

function rerender(){
  const nt = makeRuneTexture();
  runePlane.material.map.dispose();
  runePlane.material.map = nt; runeTex = nt; runePlane.material.needsUpdate=true;
}

/* ---------- UI wiring ---------- */
const panel=document.getElementById('panel'), toggle=document.getElementById('toggle');
function showPanel(v){ panel.style.display=v?'block':'none'; toggle.style.display=v?'none':'block'; }
document.getElementById('btn-render').onclick=rerender;
document.getElementById('btn-hide').onclick=()=>showPanel(false);
toggle.onclick=()=>showPanel(true);
document.getElementById('btn-spin').onclick=(e)=>{ autoSpin=!autoSpin; controls.autoRotate=autoSpin; e.target.style.background=autoSpin?'#9654f073':''; };
document.getElementById('f-bloom').oninput=(e)=>{ if(bloom) bloom.strength=parseFloat(e.target.value); };
document.getElementById('f-shade').oninput=(e)=>{ applyShade(parseFloat(e.target.value)); };
document.getElementById('f-textsize').oninput=()=>rerender();
document.getElementById('btn-png').onclick=()=>{
  if(composer) composer.render(); else renderer.render(scene,camera);
  const a=document.createElement('a'); a.download='transmission.png'; a.href=renderer.domElement.toDataURL('image/png'); a.click();
};
addEventListener('keydown',(e)=>{ if(e.key==='h'||e.key==='H') showPanel(panel.style.display==='none'); });

/* boot after fonts so canvas text uses the display + body faces */
function boot(){
  try{ init(); }
  catch(err){ const el=document.getElementById('err'); el.style.display='block';
    el.textContent='3D failed to load — you may be offline (needs the Three.js CDN). '+err.message; }
}
if(document.fonts && document.fonts.ready){
  document.fonts.load('400 60px "Julius Sans One"').catch(()=>{});
  document.fonts.load('600 40px "Cormorant Garamond"').catch(()=>{});
  document.fonts.ready.then(()=>{ boot(); setTimeout(rerender, 60); });
} else boot();
</script>
</html>
